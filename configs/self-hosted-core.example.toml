# Default core: selected unchanged controls with consistently passing observations.
# This scope does not certify stress limits or advanced schema capabilities.
# Use --policy strict-contract-v1 with dpv plan / dpv verify.
# Inspect request/token ceilings before calling your endpoint.
[run]
profile = "deepseek-core-2026-09-23-v1"
suite = "core"
protocols = ["chat", "responses"]
repetitions = 1
concurrency = 1
max_attempts_per_endpoint = 142
retries = 0
scorer_revision = "verification-v1"

[endpoints.candidate]
base_url = "http://localhost:30000/v1"
model = "your-served-deepseek-model"
model_release = "unknown"
auth_none = true
# For authentication replace auth_none with api_key_env = "CANDIDATE_API_KEY".

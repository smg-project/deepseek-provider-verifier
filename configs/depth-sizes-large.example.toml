# Opt-in offline-plannable workload. Edit endpoint details before running.
[run]
profile = "deepseek-depth-2026-09-22-v1"
suite = "sizes-large"
protocols = ["chat", "responses"]
repetitions = 1
concurrency = 1
max_attempts_per_endpoint = 92
retries = 0
scorer_revision = "unversioned"

[endpoints.candidate]
base_url = "http://localhost:30000/v1"
model = "your-served-deepseek-model"
model_release = "unknown"
auth_none = true
# For authentication, replace auth_none with api_key_env = "CANDIDATE_API_KEY".
